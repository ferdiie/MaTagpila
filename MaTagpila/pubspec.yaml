name: matagpila
description: Ma.Tagpila - POS & Inventory System for small businesses
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  firebase_storage: ^11.6.9

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  dartz: ^0.10.1
  fuzzywuzzy: ^1.1.0

  # CSV/Excel
  csv: ^6.0.0
  excel: ^4.0.3
  file_picker: ^8.0.5

  # Local storage
  shared_preferences: ^2.2.3

  # PDF generation
  pdf: ^3.10.8

  # File system path
  path_provider: ^2.1.0

  # Open PDF with native viewer
  open_file: ^3.3.2

  # Share PDF via share sheet
  share_plus: ^7.0.0

  web: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
